<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>2. Thay đổi Text</title>
</head>
<body>
  <p id="greeting">Văn bản ban đầu chưa thay đổi.</p>

  <script>
    const greeting = document.getElementById("greeting");
    // Thay đổi nội dung văn bản thuần
    greeting.innerText = "Xin chào! Nội dung đoạn văn đã được thay đổi bằng JavaScript.";
  </script>
</body>
</html>
