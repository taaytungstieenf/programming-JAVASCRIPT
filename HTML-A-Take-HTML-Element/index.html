<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>1. Lấy HTML Element</title>
</head>
<body>
  <h1 id="main-title">Tiêu đề ban đầu</h1>
  <p class="description">Đoạn văn bản mô tả ban đầu.</p>

  <script>
    // Lấy element qua ID và Class
    const titleElement = document.getElementById("main-title");
    const descElement = document.querySelector(".description");

    // In ra console để kiểm tra
    console.log("Element theo ID:", titleElement);
    console.log("Element theo Class:", descElement);
  </script>
</body>
</html>

<!-- Cầu nối giữa HTML và JS: Đây là bước bắt buộc đầu tiên trong lập trình DOM. 
 Bạn cần cho JavaScript biết chính xác đối tượng nào trên giao diện mà nó cần làm việc cùng. -->

 nội dung hoặc đính kèm sự kiện chỉ riêng cho element đó mà không làm ảnh hưởng đến phần còn lại của trang web.-->
