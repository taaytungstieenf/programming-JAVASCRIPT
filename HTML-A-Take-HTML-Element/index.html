<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mục 1 - Lấy HTML Element</title>
</head>
<body>
    <h1 id="title">Tiêu đề trang</h1>
    <p class="text-content">Đoạn văn 1</p>
    <p class="text-content">Đoạn văn 2</p>

    <script>
        // 1. Lấy theo ID
        const titleElement = document.getElementById("title");
        console.log("Theo ID:", titleElement);

        // 2. Lấy theo Class Name (trả về danh sách HTMLCollection)
        const textElements = document.getElementsByClassName("text-content");
        console.log("Theo Class Name:", textElements);

        // 3. Lấy theo querySelector (lấy phần tử đầu tiên khớp với CSS selector)
        const firstP = document.querySelector(".text-content");
        console.log("querySelector:", firstP);

        // 4. Lấy theo querySelectorAll (lấy tất cả các phần tử khớp, trả về NodeList)
        const allP = document.querySelectorAll("p");
        console.log("querySelectorAll:", allP);
    </script>
</body>
</html>
